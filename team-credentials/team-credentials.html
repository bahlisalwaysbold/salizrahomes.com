<!--
  TEAM CREDENTIALS PANEL
  -----------------------
  WHERE TO PUT IT: about.html, replacing (or right next to) your current
  team photo/name block. Each team member becomes a tappable card; tapping
  slides in a panel from the right showing their registrations and bio.

  HOW IT WORKS:
  - Each .tc-card button carries its own data-* attributes (name, title,
    photo, coren number, etc). No backend, no JS framework — one small
    script reads whichever card was tapped and fills the panel.
  - Only ONE panel/backdrop pair exists in the whole page; it just gets
    repopulated depending on which person was tapped. Add as many
    .tc-card buttons as you have team members — you do not need to
    duplicate the panel markup.

  EDITING CREDENTIALS: change the data-* attributes on each .tc-card.
  Leave a field empty ("") to have that row skipped automatically —
  e.g. if a site engineer has no CAC number, it just won't show.

  Make sure team-credentials.css is linked in the <head>:
    <link rel="stylesheet" href="css/team-credentials.css">
-->

<!-- ============ TEAM MEMBER CARDS (repeat this block per person) ============ -->

<button
  class="tc-card"
  data-photo="images/team/salisu-sumaila.jpg"
  data-name="Engr. Salisu Sumaila"
  data-title="Managing Director / CEO"
  data-coren="COREN Reg. No: [insert real number]"
  data-nse="NSE Member: [insert if applicable]"
  data-cac="Company Reg: RC 1736628"
  data-qualification="[e.g. B.Eng Civil Engineering — insert university]"
  data-experience="[e.g. 12+ years in structural detailing and building construction]"
  data-bio="[2-3 sentences: what he leads day-to-day, notable projects, what clients can expect working with him.]"
  data-verify-url="https://coren.gov.ng/verify"
>
  <img class="tc-card-photo" src="images/team/salisu-sumaila.jpg" alt="Engr. Salisu Sumaila">
  <span>
    <span class="tc-card-name">Engr. Salisu Sumaila</span>
    <span class="tc-card-title">Managing Director / CEO</span>
    <span class="tc-card-tap-hint">Tap to view credentials →</span>
  </span>
</button>

<!-- Add more .tc-card buttons here for other team members, same pattern -->

<!-- ============ PANEL + BACKDROP (only one copy needed on the page) ============ -->

<div class="tc-backdrop" id="tcBackdrop"></div>

<div class="tc-panel" id="tcPanel" role="dialog" aria-modal="true" aria-labelledby="tcPanelName">
  <div class="tc-panel-inner">
    <button class="tc-close" id="tcClose" aria-label="Close">✕</button>

    <img class="tc-panel-photo" id="tcPanelPhoto" src="" alt="">
    <h3 class="tc-panel-name" id="tcPanelName"></h3>
    <p class="tc-panel-title" id="tcPanelTitle"></p>

    <p class="tc-section-label">Registrations</p>
    <div id="tcCredentialsList"><!-- filled by JS --></div>

    <p class="tc-section-label">Background</p>
    <p class="tc-bio" id="tcPanelBio"></p>

    <a class="tc-verify" id="tcVerifyLink" href="#" target="_blank" rel="noopener noreferrer">
      Verify on COREN →
    </a>
  </div>
</div>

<script>
(function () {
  const backdrop = document.getElementById('tcBackdrop');
  const panel = document.getElementById('tcPanel');
  const closeBtn = document.getElementById('tcClose');

  const photoEl = document.getElementById('tcPanelPhoto');
  const nameEl = document.getElementById('tcPanelName');
  const titleEl = document.getElementById('tcPanelTitle');
  const credsListEl = document.getElementById('tcCredentialsList');
  const bioEl = document.getElementById('tcPanelBio');
  const verifyEl = document.getElementById('tcVerifyLink');

  function openPanel(card) {
    photoEl.src = card.dataset.photo || '';
    photoEl.alt = card.dataset.name || '';
    nameEl.textContent = card.dataset.name || '';
    titleEl.textContent = card.dataset.title || '';
    bioEl.textContent = card.dataset.bio || '';

    // Build the credentials rows, skipping any left blank
    const rows = [
      ['COREN Registration', card.dataset.coren],
      ['NSE Membership', card.dataset.nse],
      ['Company Registration', card.dataset.cac],
      ['Qualification', card.dataset.qualification],
      ['Experience', card.dataset.experience]
    ];
    credsListEl.innerHTML = rows
      .filter(([, value]) => value && value.trim() !== '')
      .map(([label, value]) => `
        <div class="tc-credential">
          <span class="tc-credential-label">${label}</span>
          <span class="tc-credential-value">${value}</span>
        </div>
      `).join('');

    if (card.dataset.verifyUrl) {
      verifyEl.href = card.dataset.verifyUrl;
      verifyEl.style.display = 'inline-flex';
    } else {
      verifyEl.style.display = 'none';
    }

    backdrop.classList.add('tc-open');
    panel.classList.add('tc-open');
    document.body.style.overflow = 'hidden';
    closeBtn.focus();
  }

  function closePanel() {
    backdrop.classList.remove('tc-open');
    panel.classList.remove('tc-open');
    document.body.style.overflow = '';
  }

  document.querySelectorAll('.tc-card').forEach(function (card) {
    card.addEventListener('click', function () {
      openPanel(card);
    });
  });

  closeBtn.addEventListener('click', closePanel);
  backdrop.addEventListener('click', closePanel);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closePanel();
  });
})();
</script>
