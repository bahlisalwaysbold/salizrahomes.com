<!--
  QUOTE REQUEST FORM
  -------------------
  WHERE TO PUT IT: drop this block into contact.html, ideally replacing
  or sitting above whatever "Get a Quote" section currently exists.

  HOW SUBMISSIONS REACH YOU (important — read this):
  Since the site is static (no backend/database), this form uses Formspree
  (formspree.io) — a free service that emails form submissions straight to
  your inbox. No server code needed on your side.

  SETUP (5 minutes, one-time):
  1. Go to formspree.io and sign up free with salizrahomes@gmail.com
  2. Create a new form, it will give you an endpoint like:
     https://formspree.io/f/xxxxabcd
  3. Replace YOUR_FORM_ID below (in the action="" attribute) with that ID.
  4. That's it — submissions will land in the Salizra Homes inbox automatically.

  Alternative: if you'd rather I wire this to WhatsApp instead of email
  (form fills out a pre-written WhatsApp message and opens a chat), say so —
  that avoids Formspree entirely but means no email record.

  Make sure quote-form.css is linked in the <head>:
    <link rel="stylesheet" href="css/quote-form.css">
-->

<div class="qf-wrapper">
  <h2>Get a Quote</h2>
  <p class="qf-sub">Tell us a bit about your project and we'll get back to you within 24 hours.</p>

  <form action="https://formspree.io/f/YOUR_FORM_ID" method="POST">

    <div class="qf-row">
      <div class="qf-field">
        <label for="qf-name">Full Name</label>
        <input type="text" id="qf-name" name="name" required>
      </div>
      <div class="qf-field">
        <label for="qf-phone">Phone Number</label>
        <input type="tel" id="qf-phone" name="phone" required>
      </div>
    </div>

    <div class="qf-field">
      <label for="qf-email">Email Address</label>
      <input type="email" id="qf-email" name="email" required>
    </div>

    <div class="qf-row">
      <div class="qf-field">
        <label for="qf-project-type">Project Type</label>
        <select id="qf-project-type" name="project_type" required>
          <option value="" disabled selected>Select one</option>
          <option value="Structural Detailing">Structural Detailing</option>
          <option value="Building Construction">Building Construction</option>
          <option value="Civil Engineering / Site Works">Civil Engineering / Site Works</option>
          <option value="Real Estate / Land">Real Estate / Land</option>
          <option value="Not Sure Yet">Not Sure Yet</option>
        </select>
      </div>
      <div class="qf-field">
        <label for="qf-budget">Estimated Budget</label>
        <select id="qf-budget" name="budget">
          <option value="" disabled selected>Select a range</option>
          <option value="Under ₦2M">Under ₦2M</option>
          <option value="₦2M – ₦10M">₦2M – ₦10M</option>
          <option value="₦10M – ₦30M">₦10M – ₦30M</option>
          <option value="₦30M+">₦30M+</option>
          <option value="Not sure yet">Not sure yet</option>
        </select>
      </div>
    </div>

    <div class="qf-row">
      <div class="qf-field">
        <label for="qf-location">Project Location</label>
        <input type="text" id="qf-location" name="location" placeholder="e.g. Tafa, Niger State" required>
      </div>
      <div class="qf-field">
        <label for="qf-timeline">Timeline</label>
        <select id="qf-timeline" name="timeline">
          <option value="" disabled selected>When are you looking to start?</option>
          <option value="Immediately">Immediately</option>
          <option value="Within 1-3 months">Within 1-3 months</option>
          <option value="3-6 months">3-6 months</option>
          <option value="Just researching">Just researching</option>
        </select>
      </div>
    </div>

    <div class="qf-field">
      <label for="qf-details">Tell us about the project</label>
      <textarea id="qf-details" name="details" rows="4" placeholder="Plot size, what you have already (drawings, land, etc.), what you need from us..."></textarea>
    </div>

    <button type="submit" class="qf-submit">Send Request</button>
    <p class="qf-note">We'll respond by phone, email or WhatsApp — whichever you prefer.</p>

  </form>
</div>
